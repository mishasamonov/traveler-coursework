# ===================== Traveler — інформаційна система планування подорожей =====================
spring.application.name=traveler
server.port=${PORT:8088}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
spring.mvc.servlet.load-on-startup=1

# Time zone of dates shown to users and entered in forms.
traveler.zone=Europe/Kyiv

# ===================== Database: PostgreSQL 16 from compose.yaml =====================
# The same schema as TravelerAPI of the laboratory works; secrets may come from the environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/traveler}
spring.datasource.username=${DB_USER:traveler}
spring.datasource.password=${DB_PASSWORD:traveler_local}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=TravelerPool

# Flyway owns the schema (V1 = TravelerAPI schema, V2 = users, V3 = demo data); Hibernate only validates.
spring.flyway.locations=classpath:db/migration,classpath:db/demo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# ===================== Thymeleaf and messages =====================
spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=uk_UA
spring.web.locale-resolver=fixed

# ===================== Logging =====================
# Console + file logs/traveler.log (also available through /actuator/logfile).
logging.file.name=logs/traveler.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
logging.level.root=INFO
logging.level.ua.edu.sumdu.traveler=INFO
logging.level.ua.edu.sumdu.traveler.audit=INFO
logging.level.org.flywaydb.core=INFO
logging.level.org.hibernate.SQL=WARN

# ===================== Spring Boot Actuator =====================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,logfile,flyway,mappings,beans,env,configprops,conditions,threaddump,scheduledtasks,httpexchanges,travel
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.endpoint.env.show-values=when-authorized
management.endpoint.env.roles=ADMIN
management.endpoint.configprops.show-values=when-authorized
management.endpoint.configprops.roles=ADMIN
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.metrics.tags.application=${spring.application.name}
management.httpexchanges.recording.include=request-headers,response-headers,time-taken,principal,remote-address

info.app.name=Traveler
info.app.description=Travel planning information system (course work, Spring Boot 3.3)
info.app.version=@project.version@
info.app.java=@java.version@
info.app.author=Mykhailo Samonov, group IN.m-62
