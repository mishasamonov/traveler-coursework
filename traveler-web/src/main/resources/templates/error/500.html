<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Внутрішня помилка')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('error')}"></header>
<main class="page">
  <div class="card error-page">
    <div class="code">500</div>
    <h1>Внутрішня помилка</h1>
    <p class="muted" th:text="${message} ?: 'Спробуйте повторити дію пізніше.'">Спробуйте повторити дію пізніше.</p>
    <p class="small muted" th:if="${incident}" th:text="'Номер інциденту для звернення: ' + ${incident}">інцидент</p>
    <div class="actions" style="justify-content:center">
      <a class="btn primary" th:href="@{/}">На головну</a>
      <a class="btn" th:href="@{/plans}">Каталог маршрутів</a>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
