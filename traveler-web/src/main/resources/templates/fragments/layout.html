<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--/* <head>: title of the page and common styles */-->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' — Traveler'">Traveler</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<!--/* Top bar: logo, navigation depending on the role, current user */-->
<header th:fragment="header(active)" class="topbar">
  <div class="inner">
    <a class="logo" th:href="@{/}">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="#0d6b6b"/>
        <path d="M16 5 L19.5 16 L16 27 L12.5 16 Z" fill="#fff"/>
        <path d="M16 5 L19.5 16 L12.5 16 Z" fill="#d9692b"/>
        <circle cx="16" cy="16" r="2.2" fill="#0d6b6b"/>
      </svg>
      Traveler
    </a>
    <nav class="nav">
      <a th:href="@{/plans}" th:classappend="${active == 'catalog'} ? 'active'">Каталог маршрутів</a>
      <a sec:authorize="isAuthenticated()" th:href="@{/my/plans}"
         th:classappend="${active == 'my'} ? 'active'">Мої подорожі</a>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}"
         th:classappend="${active == 'admin'} ? 'active'">Адміністрування</a>
    </nav>
    <div class="userbox" sec:authorize="isAuthenticated()">
      <span>
        <span class="name" sec:authentication="principal.displayName">Ім'я</span>
        <span class="badge" th:classappend="${#authentication.principal.role.name()}"
              th:text="${#authentication.principal.role.label()}">Роль</span>
      </span>
      <form th:action="@{/logout}" method="post">
        <button class="btn sm" type="submit">Вийти</button>
      </form>
    </div>
    <div class="userbox" sec:authorize="!isAuthenticated()">
      <a class="btn sm ghost" th:href="@{/register}">Реєстрація</a>
      <a class="btn sm primary" th:href="@{/login}">Увійти</a>
    </div>
  </div>
</header>

<!--/* Flash messages after redirects */-->
<div th:fragment="flash">
  <div class="alert success" th:if="${success}" th:text="${success}">OK</div>
  <div class="alert error" th:if="${error}" th:text="${error}">Помилка</div>
</div>

<footer th:fragment="footer" class="footer">
  <div class="inner">
    <span>Traveler · інформаційна система планування подорожей</span>
    <span>Spring Boot · PostgreSQL · курсова робота, 2026</span>
  </div>
</footer>

<!--/* Plan card of the lists */-->
<a th:fragment="planCard(p)" class="card plan-card" th:href="@{/plans/{id}(id=${p.id})}">
  <div class="top">
    <span class="title" th:text="${p.title}">Назва</span>
    <span class="badge" th:classappend="${p.status.name()}" th:text="${p.status.label()}">Статус</span>
  </div>
  <div class="desc" th:text="${p.description} ?: 'Без опису'">Опис</div>
  <div class="facts">
    <span th:text="${@fmt.period(p.startDate, p.endDate)}">дати</span>
    <span><b th:text="${@fmt.locations(p.locationCount)}">0 локацій</b></span>
    <span th:if="${p.budget != null}">бюджет <b th:text="${@fmt.money(p.budget, p.currency)}">0</b></span>
  </div>
  <div class="facts">
    <span th:text="${p.ownerName} ?: 'Без власника (TravelerAPI)'">Власник</span>
    <span class="badge" th:classappend="${p.isPublic} ? 'public' : 'private'"
          th:text="${p.isPublic} ? 'Публічний' : 'Приватний'">Публічний</span>
  </div>
</a>

</body>
</html>
