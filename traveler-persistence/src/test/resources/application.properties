# Integration tests: separate database traveler_test of the compose PostgreSQL (docker compose up -d).
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/traveler_test}
spring.datasource.username=traveler
spring.datasource.password=traveler_local
spring.flyway.locations=classpath:db/migration,classpath:db/demo
spring.flyway.clean-disabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=WARN
